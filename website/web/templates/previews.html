{# Preview images of the file (one per page). Loaded inline and refreshed by analysis.js into #previews_images. #}
{% for idx in range(task.file.previews|length) %}
<div class="col-6 col-md-4 pdr-preview">
  <a href="{{ url_for('api_task_download', task_id=task.uuid, seed=seed, source='img', idx=idx) }}" target="_blank"
     title="Open page {{ idx + 1 }} in full size">
    <img class="pdr-preview-img" alt="Preview of page {{ idx + 1 }}"
         src="{{ url_for('api_task_download', task_id=task.uuid, seed=seed, source='img', idx=idx) }}">
    <span class="pdr-preview-label">Page {{ idx + 1 }}</span>
  </a>
</div>
{% endfor %}
